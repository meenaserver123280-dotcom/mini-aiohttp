name: Release to PyPI

# Publishing uses PyPI Trusted Publishing (OpenID Connect).
# No API token is stored in repository secrets. PyPI must have a trusted
# publisher for: repo meenaserver123280-dotcom/mini-aiohttp, workflow release.yml,
# with no environment set.
#
# A release publish builds and validates distributions only when run by the
# release event. Upload runs on the publish job, which is used by both the
# release event and manual dispatch. Dispatch is for re-running a tag that
# already has a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Build and validate source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine setuptools-rust
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python scripts/read_version.py)"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi
      - name: Build source distribution
        run: python -m build --sdist
      - name: Validate source distribution
        run: python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    name: Build wheels
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: List distributions to upload
        run: ls -lh dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate all distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish source distribution and wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
